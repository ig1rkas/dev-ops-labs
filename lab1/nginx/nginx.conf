worker_processes 1;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;
    upstream idioma_backend {
        zone backends 64k;
        server backend1:8000 max_fails=1 fail_timeout=5s;
        server backend2:8000 max_fails=1 fail_timeout=5s;
    }
    ssl_certificate /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # An unknown Host must never fall through to the idioma application.
    server {
        listen 80 default_server;
        server_name _;
        return 404 "Unknown virtual host\n";
    }
    server {
        listen 443 ssl default_server;
        server_name _;
        return 404 "Unknown virtual host\n";
    }
    server {
        listen 80;
        server_name idioma.local second.local localhost;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name second.local;
        root /srv/second;
        location / { try_files $uri $uri/ =404; }
    }
    server {
        listen 443 ssl;
        server_name idioma.local localhost;
        root /usr/share/nginx/html;
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        location = /404.html { internal; root /srv/errors; }
        location = /50x.html { internal; root /srv/errors; }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://idioma_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 1s;
            proxy_read_timeout 15s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
        location = /docs { return 301 /docs/; }
        location /docs/ {
            alias /srv/docs/;
            autoindex off;
        }
        location = /admin {
            auth_basic "idioma lab administrator";
            auth_basic_user_file /etc/nginx/auth/.htpasswd;
            try_files /index.html =404;
        }
        location ^~ /admin/ {
            auth_basic "idioma lab administrator";
            auth_basic_user_file /etc/nginx/auth/.htpasswd;
            try_files /index.html =404;
        }
        location ~ /\. { deny all; }
        # Allow documented SPA entry points while preserving a real custom 404.
        location ~ ^/(auth|login|register|dashboard|teachers|courses|subjects|about|contacts)(/.*)?$ {
            try_files $uri /index.html;
        }
        location / { try_files $uri $uri/ =404; }
    }
}
